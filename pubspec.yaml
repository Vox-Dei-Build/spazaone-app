name: pasella
description: A new Flutter project.

publish_to: "none"

version: 4.0.1+55

environment:
  sdk: ">=3.0.5 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  provider: ^6.0.5
  font_awesome_flutter: ^10.7.0
  firebase_core: ^3.15.2
  firebase_auth: ^5.6.0
  cloud_firestore: ^5.6.0
  fl_chart: ^0.63.0
  flutter_launcher_icons: ^0.13.1
  # Replaced discontinued contacts_service (v1 plugin embedding, not Flutter
  # 3.29 / 16 KB page size compatible) with flutter_contacts.
  flutter_contacts: ^1.1.9+2
  # Bumped from ^10.4.3: the 10.x line of permission_handler_android still
  # references the removed v1 plugin embedding APIs. 11.3.1 is the highest
  # release that still supports Dart 3.7 and pulls permission_handler_android
  # 12.0.x which uses the v2 embedding.
  permission_handler: ^11.3.1
  intl: ^0.18.1
  async: ^2.11.0
  twilio_flutter: ^0.0.9
  flutter_dotenv: ^5.1.0
  cloud_functions: ^5.5.0
  package_info_plus: ^9.0.1
  firebase_remote_config: ^5.4.0
  firebase_analytics: ^11.5.0
  change_app_package_name: ^1.1.0
  firebase_messaging: ^15.2.0
  url_launcher: ^6.1.14
  # url_launcher_ios is brought transitively by url_launcher; keeping transitive 6.2.4 for Dart 3.0.6
  connectivity_plus: ^5.0.2
  hive_local_storage: ^1.1.1
  event_bus: ^2.0.0
  share_plus: ^7.2.2
  webview_flutter: ^4.13.0
  cached_network_image: ^3.3.1
  firebase_storage: ^12.4.0
  firebase_app_check: ^0.3.2
  image_picker: ^1.0.7
  shimmer: ^3.0.0
  flutter_image_compress: ^2.3.0
  sticky_headers: ^0.3.0+2
  table_calendar: ^3.0.9
  flutter_local_notifications: ^17.2.4
  # Replaced abandoned flutter_app_badger 1.5.0 (compileSdk 29, declared
  # itself as an application instead of library, and missing 16 KB-aligned
  # native code paths) with the maintained flutter_app_badger_plus fork.
  flutter_app_badger_plus: ^1.0.1

  # Observability (see docs/observability.md)
  # PostHog 4.11.0 is the last release before Dart >=3.3 floor (5.0.0).
  # Keep pinned exactly until we upgrade Flutter past 3.27.
  posthog_flutter: 4.11.0
  # Crashlytics 4.x targets firebase_core 3.x (FlutterFire 3.x coordinated set).
  firebase_crashlytics: ^4.3.0

  # Native in-app review prompt (Google Play In-App Review on Android,
  # SKStoreReviewController on iOS). Used by ReviewPromptService to surface
  # a tasteful rating ask after real value moments. 2.0.10 is the highest
  # release compatible with Dart 3.0+/Flutter 3.29.
  in_app_review: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

# Override transitive win32 5.0.9 (pulled in by package_info_plus 4.2.0)
# which uses the removed UnmodifiableUint8ListView and fails to compile on
# Dart 3.5+. Win32 is desktop-only and unused on Android/iOS but the Dart
# kernel snapshot still needs to type-check.
dependency_overrides:
  # 5.13.0 is the last release supporting Dart 3.7. 5.14+ require Dart 3.8.
  win32: '>=5.5.4 <5.14.0'
  # The platform plugins below still reference the removed Flutter v1 plugin
  # embedding APIs at the versions resolved by our pinned high-level plugins.
  # Bumping them to the first release that drops those references keeps the
  # build green on Flutter 3.29.
  flutter_plugin_android_lifecycle: ^2.0.20
  # 0.8.13+x requires Dart 3.9. 0.8.12+11 is the last version that supports
  # Dart 3.7 and also drops the v1 plugin embedding references.
  image_picker_android: '>=0.8.12+11 <0.8.13'
  # 2.2.2 still references the removed v1 plugin embedding; 2.2.20+ require
  # Dart 3.9. 2.2.18 is the highest version that supports Dart 3.7.
  path_provider_android: '>=2.2.17 <2.2.20'
  # 2.3.2 (transitive via flutter_cache_manager <- cached_network_image) still
  # references the removed v1 plugin embedding.
  sqflite: ^2.4.1
  # 6.2.2 (transitive via url_launcher) still references the removed v1
  # plugin embedding. 6.3.21+ require Dart 3.9; 6.3.20 is the highest version
  # that supports Dart 3.7.
  url_launcher_android: '>=6.3.16 <6.3.21'

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/ic_launcher.png"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/images/business_types/
    - assets/images/business_categories/
