# CodeMagic CI configuration for Pasella.
#
# Triggers
# --------
# Both workflows fire on git tags matching `v*.*.*+*` (e.g. v3.0.2+41).
# Push the tag from the release branch:
#   git tag -a v3.0.2+41 -m "Release 3.0.2+41"
#   git push --tags
#
# Distribution
# ------------
# Android  -> Google Play "internal" track (manual promote to Production)
# iOS      -> App Store Connect / TestFlight (manual promote to App Store)
#
# This is the safe default for a 3-5 day release cadence: every tag goes
# straight to internal testers; QA on TestFlight / Play Internal; promote
# the build that passes QA to the production track from the respective
# console UI.
#
# One-time setup in CodeMagic dashboard before the first run will succeed:
# 1. Settings -> Integrations -> connect GitHub repo (Vox-Dei-Build/Pasella).
# 2. Teams -> <your team> -> Code signing identities ->
#      a. Android keystore: upload `android/app/release-key.keystore` +
#         keystore password + key alias (KEY_ALIA) + key password.
#         Reference name: `pasella_upload_keystore`.
#      b. iOS distribution: choose "Automatic" / App Store Connect API key.
#         Upload the .p8 + Issuer ID + Key ID from
#         https://appstoreconnect.apple.com/access/integrations/api .
#         Reference name: `pasella_app_store_api_key`.
# 3. Teams -> <your team> -> Integrations ->
#      a. Google Play: upload service account JSON (see below).
#      b. App Store Connect: same API key as step 2b is reused.
# 4. Environment variable groups (Settings -> Environment variables):
#      - `pasella_android_credentials` group containing
#         GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (Play service account JSON)
#         and GOOGLE_SERVICES_JSON_BASE64 (base64-encoded contents of
#         the local `android/app/google-services.json` file; that file
#         is gitignored so the CodeMagic clone doesn't have it). Mark
#         both Secure. To produce GOOGLE_SERVICES_JSON_BASE64:
#           base64 -i android/app/google-services.json | pbcopy
#      - `pasella_app_store_credentials` group containing
#         APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID,
#         APP_STORE_CONNECT_PRIVATE_KEY (the .p8 contents). All secure.
#
# Play service account JSON
# -------------------------
# Google Play Console -> Setup -> API access -> Create new service account
# (in Google Cloud), grant "Release manager" + "Service account user"
# roles, then in Play Console grant the service account "Admin (all
# permissions)" or scope it to "Release apps to testing tracks" + "Manage
# production releases" + "View app information". Download the JSON.

definitions:
  instance_groups:
    macos: &macos_instance
      instance_type: mac_mini_m2
      max_build_duration: 60

    linux: &linux_instance
      instance_type: linux_x2
      max_build_duration: 60

  envs:
    flutter_version: &flutter_version
      flutter: 3.29.2
      # Xcode 26+ required by Apple as of April 2026 for any App Store
      # Connect upload (iOS 26 SDK minimum). `latest` resolves to the
      # newest stable Xcode 26.x on Codemagic's mac_mini_m2 image.
      xcode: latest
      cocoapods: default

  scripts:
    - &materialise_dotenv
      name: Materialise .env from secure env var
      # The .env file is gitignored and declared as a Flutter asset in
      # pubspec.yaml. Without it the asset bundle build fails with
      # "No file or variants found for asset: .env" during pub get,
      # flutter test, and flutter build. Codemagic exposes the file's
      # contents via the secure $DOTENV_FILE variable; write it back
      # to disk at the repo root before any Flutter step runs.
      script: |
        set -e
        if [ -z "${DOTENV_FILE:-}" ]; then
          echo "::error:: DOTENV_FILE env var is empty. Set it as a secure variable in Codemagic with the contents of the local .env file."
          exit 1
        fi
        printf '%s' "$DOTENV_FILE" > "$CM_BUILD_DIR/.env"
        echo ".env written ($(wc -c < "$CM_BUILD_DIR/.env") bytes)"

    - &materialise_google_services_json
      name: Materialise android/app/google-services.json from secure env var
      # `android/app/google-services.json` is gitignored (contains the
      # Firebase Android client config including API keys; treated as
      # per-environment config, not source). The Google Services Gradle
      # plugin (applied in android/app/build.gradle) hard-fails the
      # build with "File google-services.json is missing" when it
      # can't find the file under android/app/, android/app/src/, or
      # android/app/src/release/. The CodeMagic clone doesn't have the
      # file, so we materialise it from the secure GOOGLE_SERVICES_JSON_BASE64
      # variable in the pasella_android_credentials env var group.
      #
      # Why base64 (and not raw JSON like DOTENV_FILE)? CodeMagic env
      # vars containing curly braces / unescaped double quotes / shell
      # metacharacters get mangled by the dashboard's variable parser.
      # The .env file format is line-oriented `KEY=value` with no JSON
      # syntax so it survives; google-services.json is dense JSON and
      # does not. Base64 sidesteps the entire quoting hazard.
      #
      # To regenerate when the local file changes (e.g. new Firebase
      # client added): base64 -i android/app/google-services.json | pbcopy
      # then paste into the GOOGLE_SERVICES_JSON_BASE64 variable in the
      # Codemagic dashboard, marked Secure.
      script: |
        set -e
        if [ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
          echo "::error:: GOOGLE_SERVICES_JSON_BASE64 env var is empty. Set it as a secure variable in Codemagic with: base64 -i android/app/google-services.json"
          exit 1
        fi
        TARGET="$CM_BUILD_DIR/android/app/google-services.json"
        printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > "$TARGET"
        # Sanity-check: file must be valid JSON and contain our project
        # number, otherwise we'll waste 5 min discovering it inside
        # the Gradle build.
        if ! python3 -c "import json; json.load(open('$TARGET'))" 2>/dev/null; then
          echo "::error:: Decoded google-services.json is not valid JSON. Re-encode the source file and update the env var."
          exit 1
        fi
        echo "google-services.json written ($(wc -c < "$TARGET") bytes)"

    - &flutter_pub_get
      name: Flutter pub get
      script: |
        flutter --version
        flutter pub get

    - &flutter_analyze
      name: Flutter analyze
      script: |
        # Tolerate info AND warning findings during release CI. The
        # codebase has a long backlog of pre-existing lint warnings
        # (deprecated_member_use, unused_import, etc.) that don't
        # affect runtime; gating the build on them blocks unrelated
        # release work. The Android build that shipped today has the
        # same warnings. Hard errors still fail the step.
        flutter analyze --no-fatal-infos --no-fatal-warnings

    - &flutter_test
      name: Flutter test
      # Tolerate the workflow if no tests exist yet; do not skip silently
      # once tests land. Adjust this to a hard `flutter test` once the
      # suite is real.
      script: |
        if [ -d test ] && [ -n "$(ls -A test 2>/dev/null)" ]; then
          flutter test --no-pub
        else
          echo "::warning:: No tests found; skipping."
        fi

workflows:
  android-release:
    name: Android — Play Internal
    <<: *macos_instance
    environment:
      <<: *flutter_version
      groups:
        - pasella_android_credentials   # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS,
                                         # GOOGLE_SERVICES_JSON_BASE64
      android_signing:
        - pasella_upload_keystore       # configured in dashboard step 2a
      vars:
        PACKAGE_NAME: "com.tsepo.pasella"
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*.*.*+*'
          include: true
    cache:
      # Cache downloaded source archives (Pub, Gradle, Android SDK
      # extras) between builds. These directories never contain built
      # artifacts \u2014 only fetched dependency sources \u2014 so a stale
      # cache is at worst harmless: a fresh fetch overlays it.
      # Saves \u22483-5 min per build by avoiding cold pub get + gradle
      # wrapper download. Does NOT cache build outputs (Pods/, .gradle/
      # build/, DerivedData) because those can hide real errors after
      # dependency churn.
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    scripts:
      - *materialise_dotenv
      - *materialise_google_services_json
      - *flutter_pub_get
      - *flutter_analyze
      - *flutter_test
      - name: Verify version code matches the git tag
        script: |
          # Tag format: v<major>.<minor>.<patch>+<buildNumber>
          # Example  : v3.0.2+41
          TAG="${CM_TAG:-}"
          if [ -z "$TAG" ]; then
            echo "::warning:: CM_TAG is empty (manual branch build); skipping version check."
            exit 0
          fi
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          EXPECTED_TAG="v${PUBSPEC_VERSION}"
          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "::error:: Tag $TAG does not match pubspec version $PUBSPEC_VERSION (expected $EXPECTED_TAG)."
            exit 1
          fi
          echo "Tag $TAG matches pubspec.yaml version $PUBSPEC_VERSION ✓"
      - name: Build signed AAB
        script: |
          # The android_signing block above injects key.properties into
          # android/ before the build, so Gradle's signingConfigs.release
          # block (which reads from key.properties) will produce a
          # release-signed bundle without any local file shuffling.
          flutter build appbundle --release
      - name: Verify 16 KB page-size compliance
        script: |
          set -euo pipefail
          AAB="build/app/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB" ]; then
            echo "::error:: AAB not found at $AAB"
            exit 1
          fi
          # Extract arm64-v8a libs from the AAB and assert ELF segment
          # alignment >= 0x4000 (16 KB). This is the same gate Play
          # applies post-upload; failing it here saves the round trip.
          WORK=$(mktemp -d)
          unzip -q "$AAB" -d "$WORK"
          ARM64_DIR="$WORK/base/lib/arm64-v8a"
          if [ ! -d "$ARM64_DIR" ]; then
            echo "::warning:: No arm64-v8a libs in AAB; cannot verify."
            exit 0
          fi
          BAD=0
          for SO in "$ARM64_DIR"/*.so; do
            [ -e "$SO" ] || continue
            # readelf -lW prints program headers; LOAD entries with align
            # < 0x4000 fail the 16 KB compliance check.
            if readelf -lW "$SO" 2>/dev/null | awk '/LOAD/ && $NF !~ /0x[1-9a-f][0-9a-f]{3,}/ {print}' | grep -q .; then
              echo "::error:: $SO has LOAD segments aligned below 16 KB"
              BAD=1
            fi
          done
          if [ "$BAD" != "0" ]; then exit 1; fi
          echo "All arm64-v8a .so files are 16 KB aligned ✓"
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
      - flutter_drive.log
    publishing:
      google_play:
        # Service account JSON is in env var GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        # Don't auto-submit for review when promoting later; use Play UI.
        submit_as_draft: false
        # In_app_update_priority: 0  # leave unset; only applies to production
      email:
        recipients:
          - tsepo@voxdei.io
        notify:
          success: true
          failure: true

  ios-release:
    name: iOS — TestFlight
    <<: *macos_instance
    environment:
      <<: *flutter_version
      groups:
        - pasella_app_store_credentials  # APP_STORE_CONNECT_KEY_IDENTIFIER,
                                         # APP_STORE_CONNECT_ISSUER_ID,
                                         # APP_STORE_CONNECT_PRIVATE_KEY
                                         # (.p8 contents). All marked Secure
                                         # in the Codemagic dashboard.
      # NOTE: Intentionally omitting `ios_signing:` here. That block is
      # pre-flight automation that looks for an *existing* App Store
      # profile for com.tsepo.pasella before any script runs and aborts
      # the build with "No matching profiles found" if none exists.
      # We do not have a pre-existing profile bound to the new
      # Codemagic-owned distribution cert (created after revoking the
      # legacy iPhone Distribution cert), so the pre-flight check is
      # guaranteed to fail. Instead, the `Set up code signing` script
      # below uses `app-store-connect fetch-signing-files --create` to
      # mint a fresh profile on-the-fly, then `xcode-project use-profiles`
      # wires it into the Xcode build.
      vars:
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        BUNDLE_ID: "com.tsepo.pasella"
        APP_STORE_APPLE_ID: "6751821457"   # numeric Apple ID for Pasella
                                            # in App Store Connect.
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*.*.*+*'
          include: true
    cache:
      # See android workflow comment. iOS additionally caches the
      # CocoaPods specs repo (~3 min savings on cold pod install) and
      # the user's Pods cache (downloaded podspecs/sources, not built
      # frameworks). Pods/ itself is intentionally NOT cached \u2014 it
      # contains compiled .o/.framework outputs that go stale fast and
      # can mask real build errors after Firebase/Flutter bumps.
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
        - $HOME/.cocoapods/repos
    scripts:
      - *materialise_dotenv
      - *flutter_pub_get
      - *flutter_analyze
      - *flutter_test
      - name: Verify version code matches the git tag
        script: |
          TAG="${CM_TAG:-}"
          if [ -z "$TAG" ]; then
            echo "::warning:: CM_TAG is empty (manual branch build); skipping version check."
            exit 0
          fi
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          EXPECTED_TAG="v${PUBSPEC_VERSION}"
          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "::error:: Tag $TAG does not match pubspec $PUBSPEC_VERSION."
            exit 1
          fi
      - name: Set up code signing
        # Generate a fresh RSA private key for the build, then use the
        # App Store Connect API to mint a new Apple Distribution
        # certificate signed against it. Without --certificate-key,
        # fetch-signing-files re-uses an existing portal certificate
        # whose private key Codemagic does not have, and the install
        # step fails with "Cannot save Signing Certificates without
        # certificate private key".
        #
        # IMPORTANT: Apple caps Distribution certs at 2 per team. The
        # legacy iPhone Distribution cert was revoked manually before
        # the first run; if both slots are full this script will fail
        # at fetch-signing-files. Revoke an unused cert in the Apple
        # Developer portal before re-running.
        #
        # The same flow also fetches/creates an App Store provisioning
        # profile for $BUNDLE_ID bound to the new cert.
        script: |
          set -e
          keychain initialize
          openssl genrsa -out /tmp/codemagic_distribution.key 2048
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/codemagic_distribution.key \
            --create
          keychain add-certificates
          # use-profiles wires the minted profile into the Xcode project
          # AND writes a matching $HOME/export_options.plist with the
          # correct profile name + signingStyle=manual + teamID. We pass
          # --archive-method app-store so the generated plist targets
          # App Store distribution (not ad-hoc / development).
          xcode-project use-profiles --archive-method app-store
      - name: Pod install
        # The committed ios/Podfile.lock pins Firebase 10.22.0 transitive
        # versions (e.g. FirebaseAppCheck 10.22.0). With the Podfile bumped
        # to $FirebaseSDKVersion = 11.6.0 and Flutter plugins resolving
        # FirebaseAppCheck ~> 11.6.0-beta, pod install rejects the lock
        # mismatch and aborts. Wipe the lockfile and Pods/ before
        # resolution so CocoaPods builds a fresh dependency graph from
        # the current Podfile + plugin specs. --repo-update refreshes
        # the trunk index so Firebase 11.6.0 specs are visible.
        #
        # LANG/LC_ALL workaround addresses Ruby 3.4 / CocoaPods locale bug.
        script: |
          set -e
          cd ios
          rm -f Podfile.lock
          rm -rf Pods
          LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8 pod install --repo-update
      - name: Build IPA
        script: |
          set -e
          # `xcode-project use-profiles --archive-method app-store`
          # (see Set up code signing) writes $HOME/export_options.plist
          # with the correct provisioning profile name, signingStyle=
          # manual, teamID, and method=app-store. We must use that file
          # instead of writing our own, otherwise the export step
          # falls back to automatic signing which requires a logged-in
          # Xcode account that CI does not have, producing:
          #   "exportArchive No Accounts"
          #   "exportArchive No profiles for 'com.tsepo.pasella' were found"
          if [ ! -f "$HOME/export_options.plist" ]; then
            echo "::error:: $HOME/export_options.plist missing \u2014 xcode-project use-profiles did not run or did not find a profile."
            exit 1
          fi
          flutter build ipa --release \
            --export-options-plist="$HOME/export_options.plist"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        # Lands the build in TestFlight. Promotion to App Store review is
        # done manually from App Store Connect after QA.
        submit_to_testflight: true
        # Optionally beta-test groups to add the build to.
        # beta_groups:
        #   - "Internal"
        submit_to_app_store: false
      email:
        recipients:
          - tsepo@voxdei.io
        notify:
          success: true
          failure: true
