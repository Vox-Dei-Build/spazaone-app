# CodeMagic CI configuration for SpazaOne.
#
# Legacy technical identifiers such as com.tsepo.pasella and the
# pasella_* credential groups are intentionally unchanged so this remains an
# update to the existing store apps and continues using the configured secrets.
#
# Triggers
# --------
# Both workflows fire on git tags matching `v*.*.*+*` (e.g. v3.0.2+41).
# Push the tag from main after the release commit is approved:
#   git tag -a v3.0.2+41 -m "Release 3.0.2+41"
#   git push --tags
#
# Distribution
# ------------
# Android  -> Google Play "internal" track (manual promote to Production)
# iOS      -> App Store Connect / TestFlight (manual promote to App Store)
#
# This is the safe default for a 3-5 day release cadence: every tag goes
# straight to internal testers; QA on TestFlight / Play Internal; promote
# the build that passes QA to the production track from the respective
# console UI.
#
# One-time setup in CodeMagic dashboard before the first run will succeed:
# 1. Settings -> Integrations -> connect GitHub repo
#    (Vox-Dei-Build/spazaone-app).
# 2. Teams -> <your team> -> Code signing identities ->
#      a. Android keystore: upload `android/app/release-key.keystore` +
#         keystore password + key alias (KEY_ALIA) + key password.
#         Reference name: `pasella_upload_keystore`.
#      b. iOS distribution: store one Apple Distribution certificate with
#         its private key and one matching App Store provisioning profile for
#         `com.tsepo.pasella`. Reference them as
#         `spazaone_apple_distribution` and `spazaone_app_store_profile`.
#         Never generate a new private key per build.
# 3. Teams -> <your team> -> Integrations ->
#      a. Google Play: upload service account JSON (see below).
#      b. App Store Connect: connect the dedicated API key using its .p8,
#         Issuer ID and Key ID from
#         https://appstoreconnect.apple.com/access/integrations/api .
# 4. Environment variable groups (Settings -> Environment variables):
#      - `pasella_android_credentials` group containing
#         GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (Play service account JSON)
#         and GOOGLE_SERVICES_JSON_BASE64 (base64-encoded contents of
#         the local `android/app/google-services.json` file; that file
#         is gitignored so the CodeMagic clone doesn't have it). Mark
#         both Secure. To produce GOOGLE_SERVICES_JSON_BASE64:
#           base64 -i android/app/google-services.json | pbcopy
#      - `pasella_app_store_credentials` group containing
#         APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID,
#         APP_STORE_CONNECT_PRIVATE_KEY (the .p8 contents). All secure.
#
# Play service account JSON
# -------------------------
# Google Play Console -> Setup -> API access -> Create new service account
# (in Google Cloud), grant "Release manager" + "Service account user"
# roles, then in Play Console grant the service account "Admin (all
# permissions)" or scope it to "Release apps to testing tracks" + "Manage
# production releases" + "View app information". Download the JSON.

definitions:
  instance_groups:
    macos: &macos_instance
      instance_type: mac_mini_m2
      max_build_duration: 60

    linux: &linux_instance
      instance_type: linux_x2
      max_build_duration: 60

  envs:
    flutter_version: &flutter_version
      flutter: 3.29.2
      # Xcode 26+ required by Apple as of April 2026 for any App Store
      # Connect upload (iOS 26 SDK minimum). `latest` resolves to the
      # newest stable Xcode 26.x on Codemagic's mac_mini_m2 image.
      xcode: latest
      cocoapods: default

  scripts:
    - &materialise_dotenv
      name: Materialise .env from secure env var
      # The .env file is gitignored and declared as a Flutter asset in
      # pubspec.yaml. Without it the asset bundle build fails with
      # "No file or variants found for asset: .env" during pub get,
      # flutter test, and flutter build. Codemagic exposes the file's
      # contents via the secure $DOTENV_FILE variable; write it back
      # to disk at the repo root before any Flutter step runs.
      script: |
        set -e
        if [ -z "${DOTENV_FILE:-}" ]; then
          echo "::error:: DOTENV_FILE env var is empty. Set it as a secure variable in Codemagic with the contents of the local .env file."
          exit 1
        fi
        # Write relative to PWD (the clone root for every CodeMagic
        # script step), not to "$CM_BUILD_DIR/.env" \u2014 the latter
        # has produced phantom-write failures on at least one mac
        # builder image where $CM_BUILD_DIR diverges from the actual
        # clone path used by subsequent steps. PWD is canonical.
        printf '%s' "$DOTENV_FILE" > .env
        echo ".env written ($(wc -c < .env) bytes) to $(pwd)/.env"
        # The legacy CodeMagic credential group still contains stale mobile
        # Firebase app IDs. Keep its secrets untouched, but normalize the
        # non-secret identity fields from the registered production project
        # before the validation below and before Flutter consumes .env.
        printf '%s\n' \
          'FIREBASE_ANDROID_PROJECT_ID=pasella-ledger' \
          'FIREBASE_ANDROID_APP_ID=1:716158514645:android:a4f2b4756aafcebbe5795c' \
          'FIREBASE_IOS_PROJECT_ID=pasella-ledger' \
          'FIREBASE_IOS_APP_ID=1:716158514645:ios:17eba128d70a92a7e5795c' \
          'FIREBASE_IOS_BUNDLE_ID=com.tsepo.pasella' >> .env
        # Fail closed if a valid secret file belongs to an old/deleted Firebase
        # app or another entity. Never print credential values.
        python3 - <<'PY'
        import json
        import plistlib
        from pathlib import Path

        values = {}
        for raw in Path('.env').read_text().splitlines():
            line = raw.strip()
            if not line or line.startswith('#') or '=' not in line:
                continue
            key, value = line.split('=', 1)
            values[key.strip()] = value.strip().strip('"').strip("'")

        expected = {
            'FIREBASE_ANDROID_PROJECT_ID': 'pasella-ledger',
            'FIREBASE_ANDROID_APP_ID':
                '1:716158514645:android:a4f2b4756aafcebbe5795c',
            'FIREBASE_IOS_PROJECT_ID': 'pasella-ledger',
            'FIREBASE_IOS_APP_ID':
                '1:716158514645:ios:17eba128d70a92a7e5795c',
            'FIREBASE_IOS_BUNDLE_ID': 'com.tsepo.pasella',
        }
        mismatches = [key for key, value in expected.items()
                      if values.get(key) != value]

        with open('ios/GoogleService-Info.plist', 'rb') as handle:
            plist = plistlib.load(handle)
        crashlytics = json.loads(
            Path('ios/firebase_app_id_file.json').read_text()
        )
        if plist.get('PROJECT_ID') != 'pasella-ledger':
            mismatches.append('ios plist project')
        if plist.get('BUNDLE_ID') != 'com.tsepo.pasella':
            mismatches.append('ios plist bundle')
        if plist.get('GOOGLE_APP_ID') != expected['FIREBASE_IOS_APP_ID']:
            mismatches.append('ios plist app')
        if crashlytics.get('FIREBASE_PROJECT_ID') != 'pasella-ledger':
            mismatches.append('Crashlytics project')
        if crashlytics.get('GOOGLE_APP_ID') != expected['FIREBASE_IOS_APP_ID']:
            mismatches.append('Crashlytics app')
        if mismatches:
            raise SystemExit(
                '::error:: Firebase identity mismatch: ' + ', '.join(mismatches)
            )
        print('Firebase .env, iOS plist and Crashlytics identity verified.')
        PY

    - &materialise_google_services_json
      name: Materialise android/app/google-services.json from secure env var
      # `android/app/google-services.json` is gitignored (contains the
      # Firebase Android client config including API keys; treated as
      # per-environment config, not source). The Google Services Gradle
      # plugin (applied in android/app/build.gradle) hard-fails the
      # build with "File google-services.json is missing" when it
      # can't find the file under android/app/, android/app/src/, or
      # android/app/src/release/. The CodeMagic clone doesn't have the
      # file, so we materialise it from the secure GOOGLE_SERVICES_JSON_BASE64
      # variable in the pasella_android_credentials env var group.
      #
      # Why base64 (and not raw JSON like DOTENV_FILE)? CodeMagic env
      # vars containing curly braces / unescaped double quotes / shell
      # metacharacters get mangled by the dashboard's variable parser.
      # The .env file format is line-oriented `KEY=value` with no JSON
      # syntax so it survives; google-services.json is dense JSON and
      # does not. Base64 sidesteps the entire quoting hazard.
      #
      # To regenerate when the local file changes (e.g. new Firebase
      # client added): base64 -i android/app/google-services.json | pbcopy
      # then paste into the GOOGLE_SERVICES_JSON_BASE64 variable in the
      # Codemagic dashboard, marked Secure.
      script: |
        set -e
        if [ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
          echo "::error:: GOOGLE_SERVICES_JSON_BASE64 env var is empty. Set it as a secure variable in Codemagic with: base64 -i android/app/google-services.json"
          exit 1
        fi
        # Write relative to PWD, which CodeMagic guarantees is the
        # repo clone root for every `script:` block. We previously
        # used "$CM_BUILD_DIR/android/app/google-services.json" and
        # the file wrote successfully (step logged a byte count) but
        # Gradle in a later step couldn't find it at
        # /Users/builder/clone/android/app/google-services.json,
        # which strongly suggests $CM_BUILD_DIR resolved to a path
        # other than the actual clone root on this image. PWD is
        # the canonical anchor and matches Gradle's expectation.
        TARGET="android/app/google-services.json"
        printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > "$TARGET"
        # Sanity-check: file must be valid JSON and contain our project
        # number, otherwise we'll waste 5 min discovering it inside
        # the Gradle build.
        if ! python3 -c "import json; json.load(open('$TARGET'))" 2>/dev/null; then
          echo "::error:: Decoded google-services.json is not valid JSON. Re-encode the source file and update the env var."
          exit 1
        fi
        python3 - <<'PY'
        import json

        config = json.load(open('android/app/google-services.json'))
        if config.get('project_info', {}).get('project_id') != 'pasella-ledger':
            raise SystemExit('::error:: Android Firebase project mismatch.')
        expected_app_id = '1:716158514645:android:a4f2b4756aafcebbe5795c'
        matching = [
            client for client in config.get('client', [])
            if client.get('client_info', {})
                     .get('android_client_info', {})
                     .get('package_name') == 'com.tsepo.pasella'
            and client.get('client_info', {}).get('mobilesdk_app_id')
                == expected_app_id
        ]
        if len(matching) != 1:
            raise SystemExit(
                '::error:: Android Firebase app/package identity mismatch.'
            )
        print('Android Firebase project, app and package identity verified.')
        PY
        # Diagnostics: print absolute path + size + first key, so if
        # the build still fails at processReleaseGoogleServices we
        # have evidence of where the file actually landed and can
        # rule out CI quirks vs corrupted contents.
        ABSPATH=$(cd "$(dirname "$TARGET")" && pwd)/$(basename "$TARGET")
        echo "google-services.json written:"
        echo "  pwd:       $(pwd)"
        echo "  rel path:  $TARGET"
        echo "  abs path:  $ABSPATH"
        echo "  size:      $(wc -c < "$TARGET") bytes"
        echo "  first key: $(python3 -c "import json; print(list(json.load(open('$TARGET')).keys())[0])")"
        ls -la "android/app/google-services.json"

    - &materialise_android_signing
      name: Materialise android signing config from secure env vars
      # `android/app/release-key.keystore` and `android/key.properties`
      # are both gitignored. Without them, android/app/build.gradle's
      # signingConfigs.release block is skipped (its `if (keystoreProperties
      # File.exists() && keystoreProperties['storeFile'])` guard fails)
      # and Gradle silently produces an UNSIGNED release AAB. Play
      # rejected the 3.0.3+44 AAB with "All uploaded bundles must be
      # signed. Please sign the bundle using jarsigner." \u2014 same root
      # cause: AAB built but never signed.
      #
      # We tried the dashboard `android_signing: pasella_upload_keystore`
      # block previously; it produced "Certificate issuer: None /
      # Certificate subject: None" in the upload step, meaning the
      # dashboard reference did not actually inject key.properties on
      # this builder image. Switching to env-var materialisation so
      # the YAML is the single source of truth (matches the .env and
      # google-services.json patterns above).
      #
      # Required env vars in pasella_android_credentials (all Secure):
      #   ANDROID_KEYSTORE_BASE64
      #     base64 -i android/app/release-key.keystore | pbcopy
      #   ANDROID_KEY_PROPERTIES
      #     full contents of android/key.properties (4 lines:
      #     storeFile=./release-key.keystore, storePassword=...,
      #     keyAlias=..., keyPassword=...)
      script: |
        set -e
        if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
          echo "::error:: ANDROID_KEYSTORE_BASE64 env var is empty. Set it (Secure) with: base64 -i android/app/release-key.keystore"
          exit 1
        fi
        if [ -z "${ANDROID_KEY_PROPERTIES:-}" ]; then
          echo "::error:: ANDROID_KEY_PROPERTIES env var is empty. Set it (Secure) with the full contents of android/key.properties."
          exit 1
        fi
        # Keystore: write to android/app/release-key.keystore. The
        # `storeFile=./release-key.keystore` line in key.properties is
        # resolved by Gradle relative to android/app/ (where build.gradle
        # lives), so the keystore must land there.
        printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-key.keystore
        # key.properties: write to android/key.properties (the location
        # rootProject.file('key.properties') resolves to in build.gradle).
        printf '%s' "$ANDROID_KEY_PROPERTIES" > android/key.properties
        # Sanity-check: keystore must be a non-trivial file and
        # key.properties must contain all 4 expected keys, otherwise
        # the build will silently fall back to unsigned again.
        KS_SIZE=$(wc -c < android/app/release-key.keystore | tr -d ' ')
        if [ "$KS_SIZE" -lt 1000 ]; then
          echo "::error:: Decoded keystore is suspiciously small ($KS_SIZE bytes). Re-encode and update ANDROID_KEYSTORE_BASE64."
          exit 1
        fi
        for K in storeFile storePassword keyAlias keyPassword; do
          if ! grep -q "^$K=" android/key.properties; then
            echo "::error:: android/key.properties is missing required key: $K"
            exit 1
          fi
        done
        echo "Android signing materialised:"
        echo "  android/app/release-key.keystore: $KS_SIZE bytes"
        echo "  android/key.properties: $(wc -l < android/key.properties | tr -d ' ') lines"

    - &flutter_pub_get
      name: Flutter pub get
      script: |
        flutter --version
        flutter pub get

    - &flutter_analyze
      name: Flutter analyze
      script: |
        # Tolerate info AND warning findings during release CI. The
        # codebase has a long backlog of pre-existing lint warnings
        # (deprecated_member_use, unused_import, etc.) that don't
        # affect runtime; gating the build on them blocks unrelated
        # release work. The Android build that shipped today has the
        # same warnings. Hard errors still fail the step.
        flutter analyze --no-fatal-infos --no-fatal-warnings

    - &flutter_test
      name: Flutter test
      # Tolerate the workflow if no tests exist yet; do not skip silently
      # once tests land. Adjust this to a hard `flutter test` once the
      # suite is real.
      script: |
        if [ -d test ] && [ -n "$(ls -A test 2>/dev/null)" ]; then
          flutter test --no-pub
        else
          echo "::warning:: No tests found; skipping."
        fi

    - &functions_test
      name: Firebase Functions checks
      script: |
        npm --prefix functions ci --prefer-offline
        npm --prefix functions run test:ci

    - &verify_production_backend_contract
      name: Verify production backend contract
      script: |
        set -euo pipefail
        if [ -z "${CM_COMMIT:-}" ]; then
          echo "::error:: CM_COMMIT is required for a release build."
          exit 1
        fi
        RESPONSE_FILE=$(mktemp)
        HTTP_CODE=$(curl --silent --show-error \
          --output "$RESPONSE_FILE" \
          --write-out '%{http_code}' \
          --header 'Content-Type: application/json' \
          --data '{"data":{}}' \
          'https://us-central1-pasella-ledger.cloudfunctions.net/getEnvironmentInfo')
        python3 - "$RESPONSE_FILE" "$HTTP_CODE" "$CM_COMMIT" <<'PY'
        import json
        import sys

        response_path, http_code, expected_commit = sys.argv[1:]
        if http_code != '200':
            raise SystemExit(
                f'::error:: Production backend contract returned HTTP {http_code}.'
            )
        with open(response_path, encoding='utf-8') as handle:
            payload = json.load(handle)
        result = payload.get('result') or payload.get('data') or {}
        expected = {
            'product': 'SpazaOne',
            'environment': 'production',
            'firebaseProjectId': 'pasella-ledger',
            'apiContractVersion': '2026-08-12',
            'firestoreSchemaVersion': 2,
            'buildCommit': expected_commit,
        }
        mismatches = [
            key for key, value in expected.items() if result.get(key) != value
        ]
        if mismatches:
            raise SystemExit(
                '::error:: Production backend contract mismatch: '
                + ', '.join(mismatches)
            )
        print('Production backend identity and release commit verified.')
        PY

workflows:
  android-release:
    name: Android — Play Internal
    <<: *macos_instance
    environment:
      <<: *flutter_version
      groups:
        - pasella_android_credentials   # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS,
                                         # GOOGLE_SERVICES_JSON_BASE64,
                                         # ANDROID_KEYSTORE_BASE64,
                                         # ANDROID_KEY_PROPERTIES
      # NOTE: the dashboard `android_signing: pasella_upload_keystore`
      # reference produced unsigned AABs on this image (Certificate
      # issuer / subject = None in the publish step). We materialise
      # signing config from secure env vars instead \u2014 see the
      # materialise_android_signing script.
      vars:
        PACKAGE_NAME: "com.tsepo.pasella"
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*.*.*+*'
          include: true
    cache:
      # Cache downloaded source archives (Pub, Gradle, Android SDK
      # extras) between builds. These directories never contain built
      # artifacts \u2014 only fetched dependency sources \u2014 so a stale
      # cache is at worst harmless: a fresh fetch overlays it.
      # Saves \u22483-5 min per build by avoiding cold pub get + gradle
      # wrapper download. Does NOT cache build outputs (Pods/, .gradle/
      # build/, DerivedData) because those can hide real errors after
      # dependency churn.
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    scripts:
      - *materialise_dotenv
      - *materialise_google_services_json
      - *materialise_android_signing
      - *flutter_pub_get
      - *flutter_analyze
      - *flutter_test
      - *functions_test
      - *verify_production_backend_contract
      - name: Verify version code matches the git tag
        script: |
          # Tag format: v<major>.<minor>.<patch>+<buildNumber>
          # Example  : v3.0.2+41
          TAG="${CM_TAG:-}"
          if [ -z "$TAG" ]; then
            echo "::warning:: CM_TAG is empty (manual branch build); skipping version check."
            exit 0
          fi
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          EXPECTED_TAG="v${PUBSPEC_VERSION}"
          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "::error:: Tag $TAG does not match pubspec version $PUBSPEC_VERSION (expected $EXPECTED_TAG)."
            exit 1
          fi
          echo "Tag $TAG matches pubspec.yaml version $PUBSPEC_VERSION ✓"
      - name: Build signed AAB
        script: |
          set -e
          # Pre-flight: ensure both gitignored config files survived
          # from their materialise steps to this step's working dir.
          # If $CM_BUILD_DIR diverges from PWD on this image (which we
          # observed on at least one v3.0.3+44 build), the materialise
          # write lands somewhere Gradle can't see and we'd otherwise
          # fail 4-6 minutes later with a generic
          # "File google-services.json is missing" error. Fail fast
          # instead with the actual filesystem evidence.
          echo "Pre-flight working dir: $(pwd)"
          for F in android/app/google-services.json .env android/app/release-key.keystore android/key.properties; do
            if [ ! -f "$F" ]; then
              echo "::error:: Missing $F at $(pwd)/$F before Gradle build."
              echo "Tree of android/app:"
              ls -la android/app/ || true
              echo "Tree of repo root:"
              ls -la . || true
              exit 1
            fi
            echo "  $F: $(wc -c < "$F") bytes ✓"
          done
          # Belt-and-braces: confirm the release signingConfig will
          # actually attach. If key.properties exists but the keystore
          # path inside it doesn't resolve, Gradle silently produces
          # an unsigned AAB.
          KEYSTORE_PATH=$(grep '^storeFile=' android/key.properties | cut -d= -f2)
          # storeFile is resolved relative to android/app/ by Gradle.
          if [ ! -f "android/app/$KEYSTORE_PATH" ] && [ ! -f "$KEYSTORE_PATH" ]; then
            echo "::error:: storeFile=$KEYSTORE_PATH from key.properties does not resolve to an existing keystore. Build would produce an unsigned AAB."
            exit 1
          fi
          # The materialise_android_signing script (run earlier) wrote
          # android/key.properties + android/app/release-key.keystore,
          # so Gradle's signingConfigs.release block (which reads from
          # key.properties) will produce a release-signed bundle
          # without any local file shuffling.
          flutter build appbundle --flavor production --release \
            --dart-define=SPAZAONE_ENVIRONMENT=production \
            --dart-define=USE_FIREBASE_EMULATORS=false \
            --dart-define=BUILD_COMMIT="$CM_COMMIT" \
            --dart-define=DROPSHIP_CATALOG_V2=true
      - name: Verify 16 KB page-size compliance
        script: |
          set -euo pipefail
          AAB="build/app/outputs/bundle/productionRelease/app-production-release.aab"
          if [ ! -f "$AAB" ]; then
            echo "::error:: AAB not found at $AAB"
            exit 1
          fi
          # Extract arm64-v8a libs from the AAB and assert ELF segment
          # alignment >= 0x4000 (16 KB). This is the same gate Play
          # applies post-upload; failing it here saves the round trip.
          WORK=$(mktemp -d)
          unzip -q "$AAB" -d "$WORK"
          ARM64_DIR="$WORK/base/lib/arm64-v8a"
          if [ ! -d "$ARM64_DIR" ]; then
            echo "::warning:: No arm64-v8a libs in AAB; cannot verify."
            exit 0
          fi
          BAD=0
          for SO in "$ARM64_DIR"/*.so; do
            [ -e "$SO" ] || continue
            # readelf -lW prints program headers; LOAD entries with align
            # < 0x4000 fail the 16 KB compliance check.
            if readelf -lW "$SO" 2>/dev/null | awk '/LOAD/ && $NF !~ /0x[1-9a-f][0-9a-f]{3,}/ {print}' | grep -q .; then
              echo "::error:: $SO has LOAD segments aligned below 16 KB"
              BAD=1
            fi
          done
          if [ "$BAD" != "0" ]; then exit 1; fi
          echo "All arm64-v8a .so files are 16 KB aligned ✓"
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
      - flutter_drive.log
    publishing:
      google_play:
        # Service account JSON is in env var GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        # Don't auto-submit for review when promoting later; use Play UI.
        submit_as_draft: false
        # In_app_update_priority: 0  # leave unset; only applies to production
      email:
        recipients:
          - tsepo@voxdei.io
        notify:
          success: true
          failure: true

  ios-release:
    name: iOS — TestFlight
    <<: *macos_instance
    environment:
      <<: *flutter_version
      groups:
        - pasella_app_store_credentials  # APP_STORE_CONNECT_KEY_IDENTIFIER,
                                         # APP_STORE_CONNECT_ISSUER_ID,
                                         # APP_STORE_CONNECT_PRIVATE_KEY
                                         # (.p8 contents). All marked Secure
                                         # in the Codemagic dashboard.
      # Fetch the persistent certificate/profile pair stored in CodeMagic.
      # This must remain stable across builds; per-build private keys exhaust
      # Apple Distribution certificate slots.
      ios_signing:
        provisioning_profiles:
          - spazaone_app_store_profile
        certificates:
          - spazaone_apple_distribution
      vars:
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        BUNDLE_ID: "com.tsepo.pasella"
        APP_STORE_APPLE_ID: "6751821457"   # numeric Apple ID for the existing
                                            # app record (formerly Pasella).
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*.*.*+*'
          include: true
    cache:
      # See android workflow comment. iOS additionally caches the
      # CocoaPods specs repo (~3 min savings on cold pod install) and
      # the user's Pods cache (downloaded podspecs/sources, not built
      # frameworks). Pods/ itself is intentionally NOT cached \u2014 it
      # contains compiled .o/.framework outputs that go stale fast and
      # can mask real build errors after Firebase/Flutter bumps.
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
        - $HOME/.cocoapods/repos
    scripts:
      - *materialise_dotenv
      - *flutter_pub_get
      - *flutter_analyze
      - *flutter_test
      - *functions_test
      - *verify_production_backend_contract
      - name: Verify version code matches the git tag
        script: |
          TAG="${CM_TAG:-}"
          if [ -z "$TAG" ]; then
            echo "::warning:: CM_TAG is empty (manual branch build); skipping version check."
            exit 0
          fi
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          EXPECTED_TAG="v${PUBSPEC_VERSION}"
          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "::error:: Tag $TAG does not match pubspec $PUBSPEC_VERSION."
            exit 1
          fi
      - name: Set up code signing
        # CodeMagic installs the persistent signing identity declared in
        # environment.ios_signing before scripts run. use-profiles wires that
        # profile into Xcode and writes $HOME/export_options.plist.
        script: |
          xcode-project use-profiles --archive-method app-store
      - name: Strip flutter_app_badger_plus invalid privacy manifest
        # flutter_app_badger_plus 1.0.1 (Dart) / 1.3.0 (podspec) ships
        # an invalid PrivacyInfo.xcprivacy that causes Apple to reject
        # the IPA with ITMS-91056 ~45 min after upload. Builds
        # 3.0.3+44 and +45 both shipped broken to Apple before we
        # caught it. This step deletes the manifest from pub-cache and
        # patches the podspec to remove the s.resource_bundles line so
        # CocoaPods never declares the bundle. Must run AFTER
        # flutter_pub_get (which rehydrates pub-cache) and BEFORE
        # `pod install` (which reads the podspec). See
        # scripts/strip_badger_privacy.sh for the full rationale.
        script: |
          ./scripts/strip_badger_privacy.sh
      - name: Pod install
        # The committed ios/Podfile.lock pins Firebase 10.22.0 transitive
        # versions (e.g. FirebaseAppCheck 10.22.0). With the Podfile bumped
        # to $FirebaseSDKVersion = 11.6.0 and Flutter plugins resolving
        # FirebaseAppCheck ~> 11.6.0-beta, pod install rejects the lock
        # mismatch and aborts. Wipe the lockfile and Pods/ before
        # resolution so CocoaPods builds a fresh dependency graph from
        # the current Podfile + plugin specs. --repo-update refreshes
        # the trunk index so Firebase 11.6.0 specs are visible.
        #
        # LANG/LC_ALL workaround addresses Ruby 3.4 / CocoaPods locale bug.
        script: |
          set -e
          cd ios
          rm -f Podfile.lock
          rm -rf Pods
          LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8 pod install --repo-update
      - name: Build IPA
        script: |
          set -e
          # `xcode-project use-profiles --archive-method app-store`
          # (see Set up code signing) writes $HOME/export_options.plist
          # with the correct provisioning profile name, signingStyle=
          # manual, teamID, and method=app-store. We must use that file
          # instead of writing our own, otherwise the export step
          # falls back to automatic signing which requires a logged-in
          # Xcode account that CI does not have, producing:
          #   "exportArchive No Accounts"
          #   "exportArchive No profiles for 'com.tsepo.pasella' were found"
          if [ ! -f "$HOME/export_options.plist" ]; then
            echo "::error:: $HOME/export_options.plist missing \u2014 xcode-project use-profiles did not run or did not find a profile."
            exit 1
          fi
          flutter build ipa --flavor production --release \
            --dart-define=SPAZAONE_ENVIRONMENT=production \
            --dart-define=USE_FIREBASE_EMULATORS=false \
            --dart-define=BUILD_COMMIT="$CM_COMMIT" \
            --dart-define=DROPSHIP_CATALOG_V2=true \
            --export-options-plist="$HOME/export_options.plist"
      - name: Verify IPA privacy manifests are valid
        # Defensive post-build assertion. Apple's App Store Connect
        # validator takes ~45 minutes to reject an upload with
        # ITMS-91056 for an invalid PrivacyInfo.xcprivacy; we burned
        # two release cycles (3.0.3+44 and 3.0.3+45) discovering this
        # the slow way for flutter_app_badger_plus's broken manifest.
        # Catch it here in 3 seconds instead.
        #
        # The Podfile post_install hook strips
        # flutter_app_badger_plus_privacy.bundle/PrivacyInfo.xcprivacy
        # at pod-install time. This step asserts the strip actually
        # worked by unzipping the IPA and checking the bundle is gone.
        # Also scans every other PrivacyInfo.xcprivacy that DID make
        # it into the IPA for the same empty-<dict/> antipattern, so
        # if a future plugin update introduces the same bug we catch
        # it here, not 45 min later from Apple.
        script: |
          set -euo pipefail
          IPA=$(ls build/ios/ipa/*.ipa | head -n1)
          if [ -z "$IPA" ] || [ ! -f "$IPA" ]; then
            echo "::error:: No IPA found under build/ios/ipa/"
            exit 1
          fi
          echo "Verifying privacy manifests in: $IPA"
          WORK=$(mktemp -d)
          unzip -q "$IPA" -d "$WORK"
          APP_DIR=$(ls -d "$WORK"/Payload/*.app | head -n1)
          # 1. The known-bad bundle must NOT be present.
          BAD_BUNDLE="$APP_DIR/Frameworks/flutter_app_badger_plus.framework/flutter_app_badger_plus_privacy.bundle"
          if [ -d "$BAD_BUNDLE" ] || [ -f "$BAD_BUNDLE/PrivacyInfo.xcprivacy" ]; then
            echo "::error:: flutter_app_badger_plus_privacy.bundle/PrivacyInfo.xcprivacy is still in the IPA. Podfile post_install strip did not run or did not find the source file. Apple will reject this upload with ITMS-91056."
            find "$APP_DIR" -name "flutter_app_badger_plus_privacy*" -print
            exit 1
          fi
          # Belt and braces: glob anywhere in the .app for any
          # *flutter_app_badger_plus*privacy* asset.
          STRAY=$(find "$APP_DIR" -iname "*flutter_app_badger_plus*privacy*" 2>/dev/null || true)
          if [ -n "$STRAY" ]; then
            echo "::error:: Stray flutter_app_badger_plus privacy asset still in IPA:"
            echo "$STRAY"
            exit 1
          fi
          # 2. Scan every remaining PrivacyInfo.xcprivacy in the IPA
          # for the empty-<dict/> antipattern that triggers ITMS-91056.
          # plutil -lint catches XML/plist syntax errors but NOT
          # semantic errors like empty dicts in API/data-type arrays,
          # which is exactly the bug class Apple rejects on. We use a
          # python check that walks the plist structure.
          ALL_MANIFESTS=$(find "$APP_DIR" -name "PrivacyInfo.xcprivacy" 2>/dev/null || true)
          if [ -z "$ALL_MANIFESTS" ]; then
            echo "No PrivacyInfo.xcprivacy files in IPA. Nothing more to validate."
          else
            echo "Found $(echo "$ALL_MANIFESTS" | wc -l | tr -d ' ') privacy manifest(s) to validate:"
            echo "$ALL_MANIFESTS"
            INVALID=0
            while IFS= read -r M; do
              [ -z "$M" ] && continue
              if ! plutil -lint "$M" >/dev/null 2>&1; then
                echo "::error:: $M is not valid plist XML"
                INVALID=1
                continue
              fi
              # Check for empty dicts in API / data-type arrays.
              python3 - "$M" <<'PY' || INVALID=1
          import plistlib, sys
          path = sys.argv[1]
          with open(path, 'rb') as f:
              data = plistlib.load(f)
          bad = []
          for key in ('NSPrivacyAccessedAPITypes', 'NSPrivacyCollectedDataTypes'):
              for i, entry in enumerate(data.get(key, [])):
                  if not isinstance(entry, dict) or len(entry) == 0:
                      bad.append(f"{key}[{i}] is empty/invalid")
                      continue
                  required = 'NSPrivacyAccessedAPIType' if key == 'NSPrivacyAccessedAPITypes' else 'NSPrivacyCollectedDataType'
                  if required not in entry:
                      bad.append(f"{key}[{i}] missing required key {required}")
          if bad:
              print(f"::error:: Invalid manifest {path}:")
              for b in bad:
                  print(f"  - {b}")
              sys.exit(1)
          print(f"  ✓ {path}")
          PY
            done <<< "$ALL_MANIFESTS"
            if [ "$INVALID" != "0" ]; then
              echo "::error:: One or more PrivacyInfo.xcprivacy files in the IPA would be rejected by Apple (ITMS-91056). Fix the offending plugin manifest in ios/Podfile post_install before re-uploading."
              exit 1
            fi
          fi
          echo "All privacy manifests in IPA are valid ✓"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        # Lands the build in TestFlight. Promotion to App Store review is
        # done manually from App Store Connect after QA.
        submit_to_testflight: true
        # Optionally beta-test groups to add the build to.
        # beta_groups:
        #   - "Internal"
        submit_to_app_store: false
      email:
        recipients:
          - tsepo@voxdei.io
        notify:
          success: true
          failure: true
