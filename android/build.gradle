allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                if (namespace == null) {
                    namespace project.group
                }
                // Some long-tail plugins still declare an old compileSdkVersion
                // (e.g. flutter_app_badger_plus pins 29) which is incompatible
                // with modern androidx-core resources (the `lStar` attribute is
                // only present from API 31). Force every subproject to compile
                // against the same SDK as the app to avoid resource-linking
                // failures.
                compileSdkVersion 36
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
