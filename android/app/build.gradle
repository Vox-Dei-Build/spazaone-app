plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

// The Flutter Gradle plugin loads `localProperties` and `localPropertiesFile`
// into the build script scope automatically. We only need to read additional
// properties from them here.

// Read versionCode/versionName from Flutter (which reads them from
// pubspec.yaml `version: <name>+<code>`). pubspec is the single source of
// truth for both Android and iOS version metadata.
def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Flutter passes --dart-define values to Gradle as comma-separated base64.
// Decode only the emulator switch so native Firebase Messaging is disabled
// before FirebaseApp starts in isolated QA builds. Ordinary debug builds keep
// push registration enabled for physical-device testing.
def dartDefineValues = [:]
if (project.hasProperty('dart-defines')) {
    project.property('dart-defines').toString().split(',').each { encoded ->
        if (!encoded) return
        def decoded = new String(encoded.decodeBase64(), 'UTF-8')
        def separator = decoded.indexOf('=')
        if (separator > 0) {
            dartDefineValues[decoded.substring(0, separator)] =
                decoded.substring(separator + 1)
        }
    }
}
def firebaseMessagingAutoInitEnabled =
    dartDefineValues['USE_FIREBASE_EMULATORS'] != 'true'
def firebaseInitProviderEnabled = firebaseMessagingAutoInitEnabled
def firebaseEmulatorCleartextEnabled =
    dartDefineValues['USE_FIREBASE_EMULATORS'] == 'true'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.tsepo.pasella"
    compileSdkVersion 35
    ndkVersion "29.0.13599879"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.tsepo.pasella"
        // Bumped from 23 to 24 for webview_flutter 4.x (system WebView 88+).
        minSdkVersion 24
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
        manifestPlaceholders.firebaseInitProviderEnabled =
            firebaseInitProviderEnabled.toString()
        manifestPlaceholders.firebaseMessagingAutoInitEnabled =
            firebaseMessagingAutoInitEnabled.toString()
        manifestPlaceholders.firebaseEmulatorCleartextEnabled =
            firebaseEmulatorCleartextEnabled.toString()
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists() && keystoreProperties['storeFile']) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // R8 currently breaks startup before Dart runs on Android release
            // builds (FlutterActivity -> FlutterEngineGroup -> MethodChannel
            // null messenger crash). Keep release builds unobfuscated until
            // plugin-specific keep rules are proven in QA.
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists() && keystoreProperties['storeFile']) {
                signingConfig signingConfigs.release
            }
        }
    }

    // AGP 8.5.1+ aligns native libraries to 16 KB by default. This block is
    // declared explicitly so the requirement is documented and enforced even
    // if AGP defaults change in the future. See:
    // https://developer.android.com/guide/practices/page-sizes
    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
    }
}

flutter {
    source '../..'
}

// Force reCAPTCHA Enterprise to a non-deprecated, security-patched version.
// Firebase Auth 22.x (via Firebase BoM 32.x) transitively pulls in
// com.google.android.recaptcha:recaptcha:18.1.2, which Google has flagged
// as deprecated and containing a critical security vulnerability. Until
// we bump the Firebase BoM (larger change), pin to 18.5.1 (the latest
// 18.5.x as of May 2026) at the resolution layer.
configurations.configureEach {
    resolutionStrategy {
        force 'com.google.android.recaptcha:recaptcha:18.5.1'
    }
}

dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
