# gitleaks configuration — secret scanning before commits land.
#
# Run locally:
#   gitleaks protect --staged --redact --verbose
#   gitleaks detect  --redact --verbose            # scan working tree
#   gitleaks detect  --log-opts="--all" --redact   # scan full history
#
# Install: https://github.com/gitleaks/gitleaks  (brew install gitleaks)

title = "pasella-ledger gitleaks config"

# Inherit the upstream default ruleset (AWS, GCP, Stripe, generic API keys, etc).
[extend]
useDefault = true

# Project-specific rules.
[[rules]]
id = "paystack-secret-key"
description = "Paystack secret key (test or live)"
regex = '''sk_(test|live)_[0-9a-zA-Z]{20,}'''
tags = ["key", "paystack"]

[[rules]]
id = "paystack-public-key"
description = "Paystack public key"
regex = '''pk_(test|live)_[0-9a-zA-Z]{20,}'''
tags = ["key", "paystack"]

[[rules]]
id = "twilio-auth-token"
description = "Twilio Auth Token (32 hex after TWILIO_*TOKEN=)"
regex = '''(?i)twilio[_-]?(auth[_-]?)?token["'=:\s]+[0-9a-f]{32}'''
tags = ["key", "twilio"]

[[rules]]
id = "twilio-account-sid"
description = "Twilio Account SID"
regex = '''AC[0-9a-f]{32}'''
tags = ["key", "twilio"]

[[rules]]
id = "firebase-private-key"
description = "Firebase / GCP service-account private key block"
regex = '''-----BEGIN (RSA |EC )?PRIVATE KEY-----'''
tags = ["key", "gcp", "firebase"]

[[rules]]
id = "gcp-service-account-json"
description = "GCP service-account JSON (type field)"
regex = '''"type"\s*:\s*"service_account"'''
tags = ["key", "gcp"]

# Allowlist — paths and patterns we trust not to contain real secrets.
[allowlist]
description = "Allow example/template files and lockfiles"
paths = [
  '''(^|/)\.env\.example$''',
  '''(^|/)\.gitleaks\.toml$''',
  '''(^|/)package-lock\.json$''',
  '''(^|/)pubspec\.lock$''',
  '''(^|/)Podfile\.lock$''',
]
# Allow placeholder values inside example files.
regexes = [
  '''sk_(test|live)_xxx+''',
  '''AC[xX]{32}''',
]
